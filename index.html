/* ---------- Supabase: sessão e requisições ---------- */
function setSes(j){
  const u=j.user||(SES&&SES.user)||{};
  SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(+j.expires_in||3600),user:{id:u.id,email:String(u.email||"").toLowerCase()}};
  store.set(SES_KEY,JSON.stringify(SES));
}
let REF=null;
function refreshSes(){
  if(!SES)return Promise.reject({auth:true});
  if(REF)return REF;
  REF=(async()=>{
    const r=await tfetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:SES.refresh_token})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){if(r.status>=400&&r.status<500)throw{auth:true};throw{msg:"Servidor indisponível."}}
    setSes(j);return j.access_token;
  })();
  const clear=()=>{REF=null};REF.then(clear,clear);
  return REF;
}
async function token(){
  if(!SES)throw{auth:true};
  if(SES.expires_at-60>Date.now()/1000)return SES.access_token;
  return refreshSes();
}
/* Último contato real com o Supabase (qualquer resposta = servidor alcançado) */
const NETD={ok:0,err:"",errEm:0,http:0};
async function tfetch(url,opt,ms){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);
  const sb=String(url).indexOf(SB_URL)===0;
  try{
    const r=await fetch(url,Object.assign({signal:c.signal},opt));
    if(sb&&r.type!=="opaque"){NETD.ok=Date.now();NETD.http=r.status;if(NET.st==="off"||NET.st==="srv"){if(r.status<500)setNet("ok","Internet e Supabase funcionando.")}}
    return r;
  }catch(e){
    if(sb){NETD.err=(e&&e.name==="AbortError")?"Tempo esgotado (sem resposta em "+Math.round((ms||12000)/1000)+"s)":((e&&e.name?e.name+": ":"")+(e&&e.message||e));NETD.errEm=Date.now()}
    throw e;
  }finally{clearTimeout(t)}
}
async function rest(path,opt){
  opt=opt||{};
  const go=tk=>tfetch(SB_URL+"/rest/v1/"+path,{method:opt.method||"GET",keepalive:!!opt.keepalive,body:opt.body,headers:Object.assign({apikey:SB_KEY,Authorization:"Bearer "+tk,"Content-Type":"application/json"},opt.headers||{})});
  let r;
  try{r=await go(await token())}
  catch(e){if(e&&e.auth)throw e;await new Promise(x=>setTimeout(x,1200));r=await go(await token())}
  if(r.status===401)r=await go(await refreshSes());
  return r;
}
const isTableErr=(r,j)=>r.status===404||(j&&(j.code==="PGRST205"||j.code==="42P01"));

}

/* ---------- Visualizador de foto com zoom (pinça, toque duplo, roda do mouse, arrastar) ---------- */
let ZV=null;
function openZoom(src,alt){
  if(ZV)closeZoom();
  const d=document.createElement("div");d.className="zv";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.setAttribute("aria-label","Foto ampliada");
  d.innerHTML=`<img alt=""><div class="zt"><span></span><button data-z="x" aria-label="Fechar">✕</button></div><div class="zb"><button data-z="-" aria-label="Diminuir zoom">−</button><span class="zp">100%</span><button data-z="+" aria-label="Aumentar zoom">+</button><button data-z="r" aria-label="Tamanho original" style="font-size:14px">1:1</button></div>`;
  const img=d.querySelector("img");img.src=src;img.alt=alt||"";d.querySelector(".zt span").textContent=alt||"";
  document.body.appendChild(d);document.body.classList.add("lock");
  const st={s:1,x:0,y:0,w:0,h:0,pts:new Map(),pinch:null,pan:null,lastTap:0,moved:false};
  ZV={d,img,st};
  const MAX=5;
  const fit=()=>{ /* tamanho da foto ajustada à tela (escala 1) */
    const vw=d.clientWidth,vh=d.clientHeight,nw=img.naturalWidth||vw,nh=img.naturalHeight||vh,k=Math.min(vw/nw,vh/nh,1)||1;
    st.w=nw*k;st.h=nh*k;img.style.width=st.w+"px";img.style.height=st.h+"px";img.style.maxWidth="none";img.style.maxHeight="none";
  };
  const clamp=()=>{
    const vw=d.clientWidth,vh=d.clientHeight,W=st.w*st.s,H=st.h*st.s;
    const mx=Math.max(0,(W-vw)/2),my=Math.max(0,(H-vh)/2);
    st.x=Math.min(mx,Math.max(-mx,st.x));st.y=Math.min(my,Math.max(-my,st.y));
  };
  const draw=(anim)=>{
    clamp();
    img.style.transition=anim?"transform .2s ease":"none";
    img.style.transform=`translate(${st.x-st.w*st.s/2}px,${st.y-st.h*st.s/2}px) scale(${st.s})`;
    d.querySelector(".zp").textContent=Math.round(st.s*100)+"%";
  };
  /* zoom mantendo fixo o ponto (px,py) da tela */
  const zoomAt=(ns,px,py,anim)=>{
    ns=Math.min(MAX,Math.max(1,ns));
    const cx=d.clientWidth/2,cy=d.clientHeight/2,r=ns/st.s;
    st.x=(px-cx)-(px-cx-st.x)*r;st.y=(py-cy)-(py-cy-st.y)*r;st.s=ns;
    if(ns===1){st.x=0;st.y=0}
    draw(anim);
  };
  const center=()=>({x:d.clientWidth/2,y:d.clientHeight/2});
  if(img.complete&&img.naturalWidth){fit();draw()}else img.onload=()=>{fit();draw()};
  const onResize=()=>{fit();draw()};window.addEventListener("resize",onResize);ZV.onResize=onResize;

  d.addEventListener("click",e=>{
    e.stopPropagation();
    const b=e.target.closest("[data-z]");if(!b)return;
    const z=b.dataset.z,c=center();
    if(z==="x")closeZoom();
    else if(z==="+")zoomAt(st.s*1.5,c.x,c.y,true);
    else if(z==="-")zoomAt(st.s/1.5,c.x,c.y,true);
    else if(z==="r")zoomAt(1,c.x,c.y,true);
  });
  d.addEventListener("wheel",e=>{e.preventDefault();zoomAt(st.s*Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY,false)},{passive:false});
  d.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    d.setPointerCapture&&d.setPointerCapture(e.pointerId);
    st.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});st.moved=false;
    if(st.pts.size===2){
      const [a,b]=[...st.pts.values()];
      st.pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1,s:st.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};st.pan=null;
    }else if(st.pts.size===1){st.pan={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y}}
  });
  d.addEventListener("pointermove",e=>{
    if(!st.pts.has(e.pointerId))return;
    st.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(st.pinch&&st.pts.size>=2){
      const [a,b]=[...st.pts.values()],dist=Math.hypot(a.x-b.x,a.y-b.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      zoomAt(st.pinch.s*dist/st.pinch.dist,mx,my,false);
      st.x+=mx-st.pinch.mx;st.y+=my-st.pinch.my;st.pinch.mx=mx;st.pinch.my=my;st.pinch.s=st.s;st.pinch.dist=dist;draw(false);
      st.moved=true;
    }else if(st.pan){
      const dx=e.clientX-st.pan.x,dy=e.clientY-st.pan.y;
      if(Math.abs(dx)+Math.abs(dy)>6)st.moved=true;
      if(st.s>1){st.x=st.pan.ox+dx;st.y=st.pan.oy+dy;draw(false)}
    }
  });
  const up=e=>{
    if(!st.pts.has(e.pointerId))return;
    st.pts.delete(e.pointerId);
    if(st.pts.size<2)st.pinch=null;
    if(st.pts.size===1){const p=[...st.pts.values()][0];st.pan={x:p.x,y:p.y,ox:st.x,oy:st.y};return}
    st.pan=null;
    if(e.type!=="pointerup"||st.moved)return;
    const now=Date.now();
    if(now-st.lastTap<300){ /* toque duplo: amplia no ponto tocado ou volta ao normal */
      st.lastTap=0;
      zoomAt(st.s>1.05?1:2.5,e.clientX,e.clientY,true);
    }else{
      st.lastTap=now;
      /* toque simples fora da foto, sem zoom: fecha */
      const r=img.getBoundingClientRect(),fora=e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;
      if(fora&&st.s<=1.01)setTimeout(()=>{if(ZV&&ZV.st===st&&st.lastTap===now)closeZoom()},310);
    }
  };
  d.addEventListener("pointerup",up);d.addEventListener("pointercancel",up);
  d.querySelector('[data-z="x"]').focus();
}
function closeZoom(){
  if(!ZV)return;
  window.removeEventListener("resize",ZV.onResize);
  ZV.d.remove();ZV=null;
  document.body.classList.toggle("lock",!!((S.me&&S.det)||S.adm||(typeof G!=="undefined"&&G)||(typeof SH!=="undefined"&&SH)||(typeof CR!=="undefined"&&CR)));
}
document.addEventListener("keydown",e=>{
  if(!ZV)return;
  const c={x:ZV.d.clientWidth/2,y:ZV.d.clientHeight/2};
  if(e.key==="Escape"){e.stopImmediatePropagation();closeZoom()}
  else if(e.key==="+"||e.key==="="){ZV.d.querySelector('[data-z="+"]').click()}
  else if(e.key==="-"){ZV.d.querySelector('[data-z="-"]').click()}
  else if(e.key==="0"){ZV.d.querySelector('[data-z="r"]').click()}
},true);

async function checkNet(){
  if(checking)return;checking=true;
  if(NET.st!=="ok")setNet("chk","Verificando…");
  try{
    /* 1) pergunta ao Supabase (com a chave). Duas tentativas, para redes móveis instáveis */

    for(let i=0;i<2&&!r;i++){
      try{r=await tfetch(SB_URL+"/auth/v1/health",{headers:{apikey:SB_KEY},cache:"no-store"},i?15000:9000)}
      catch(e){if(i===0)await new Promise(x=>setTimeout(x,1500))}

      else if(noSite)setNet("srv","Sem resposta do Supabase neste modo de abertura. Abra pelo link oficial (toque em Detalhes).");
      else setNet("srv","Sem resposta do Supabase. Verifique a internet e toque em Testar.");
      return;
    }
    /* 2) chave: se a antiga for recusada, usa a publishable */
    if(r.status===401||r.status===403){SB_KEY=SB_PUB;r=await tfetch(SB_URL+"/auth/v1/health",{headers:{apikey:SB_KEY},cache:"no-store"},9000)}
    if(r.status===401||r.status===403){setNet("srv","Supabase alcançado, mas a chave de acesso foi recusada. Confira a chave anon/publishable no painel.");return}
    if(r.status>=500){setNet("srv","Supabase fora do ar no momento (projeto pausado ou em manutenção).");return}
    /* 3) logado: confere o banco de verdade */
    if(S.me&&SES&&!S.pend){
      const t=await rest("wilfit_data?select=user_id&limit=1");
      if(t.ok){setNet("ok","Internet e Supabase funcionando. Dados na nuvem.");schedule();return}
      const j=await t.json().catch(()=>null);

      setNet("srv","Supabase respondeu com erro: "+((j&&j.message)||t.status));return
    }
    setNet("ok","Internet e Supabase funcionando.");
  }catch(e){
    if(e&&e.auth){setNet("ok","Internet e Supabase funcionando.");return}
    if(Date.now()-NETD.ok<90000)setNet("ok","Internet e Supabase funcionando.");
    else setNet("srv","Resposta lenta ou instável do Supabase. Toque em Testar para tentar de novo.");
  }finally{checking=false}
}

async function mirTabela(em,uid,nome,conf,chave,linhas){
  const hash=JSON.stringify(linhas),k=em+":"+nome;
  if(MIR[k]===hash)return true;
  if(linhas.length){
    const r=await rest(nome+"?on_conflict="+conf,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:hash});
    if(!r.ok){const j=await r.json().catch(()=>null);if(isTableErr(r,j))return false;throw new Error((j&&j.message)||("Erro "+r.status))}
  }
  const ids=linhas.map(l=>String(l[chave]).replace(/[^\w\-:]/g,""));
  const filtro=ids.length?"&"+chave+"=not.in.("+ids.map(encodeURIComponent).join(",")+")":"";
  const d=await rest(nome+"?user_id=eq."+encodeURIComponent(uid)+filtro,{method:"DELETE",headers:{Prefer:"return=minimal"}});
  if(!d.ok&&d.status!==404)throw new Error("Erro "+d.status);
  MIR[k]=hash;MIR[em+":em"]=Date.now();mirSave();return true;
}

const SYNC_TXT={ok:"☁ Sincronizado",pend:"☁ Salvando…",err:"⚠ Falha ao sincronizar",off:"☁ Offline"};
let LASTSYNC=0;
function paintSync(){const e=document.getElementById("sync");if(!e)return;
  if(S.sync==="ok"&&LASTSYNC){const d=new Date(LASTSYNC);e.textContent="☁ "+pad(d.getHours())+":"+pad(d.getMinutes());e.title="Sincronizado às "+pad(d.getHours())+":"+pad(d.getMinutes())}
  else e.textContent=SYNC_TXT[S.sync]||""}
function setSync(s){S.sync=s;if(s==="ok")LASTSYNC=Date.now();paintSync()}
let pushing=false,timer=null,LAST="",WARNED=false;
function schedule(){
  if(!S.me||!SES||!DB[S.me]||S.pend)return;
  if(JSON.stringify(DB[S.me])===LAST)return;
  DIRTY[S.me]=true;saveDirty();setSync("pend");
  clearTimeout(timer);timer=setTimeout(()=>push(),900);
}
async function push(ka){
  clearTimeout(timer);timer=null;
  if(!S.me||!SES||pushing||S.pend)return;
  const em=S.me,uid=SES.user.id,snap=JSON.stringify(DB[em]);
  if(snap===LAST&&!DIRTY[em]){setSync("ok");return}
  pushing=true;
  try{
    const r=await rest("wilfit_data?on_conflict=user_id",{method:"POST",keepalive:!!ka&&snap.length<60000,headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:uid,email:em,data:JSON.parse(snap),updated_at:new Date().toISOString()})});
    if(!r.ok){const j=await r.json().catch(()=>null);throw{msg:(j&&j.message)||"Erro "+r.status,table:isTableErr(r,j),perm:!!(j&&j.code==="42501")}}
    LAST=snap;setTimeout(espelhar,300);
    if(NET.st!=="ok")setNet("ok","Internet e Supabase funcionando. Dados na nuvem.");
    if(S.me===em){
      if(JSON.stringify(DB[em])===snap){delete DIRTY[em];saveDirty();setSync("ok")}
      else{pushing=false;schedule()}
    }
  }catch(e){
    if(e&&e.auth){forceLogout("Sessão expirada. Entre novamente.")}
    else{
      setSync(navigator.onLine===false&&!(Date.now()-NETD.ok<90000)?"off":"err");
      if(e&&e.table)setNet("tbl","Tabela não existe no Supabase. Rode o supabase_setup.sql no SQL Editor.");
      else if(!navigator.onLine||(e&&e.name==="AbortError")||(e instanceof TypeError))checkNet();
      if(e&&(e.table||e.perm)&&!WARNED){WARNED=true;toast(e.table?"Tabela não encontrada no Supabase. Rode o supabase_setup.sql.":"Sem permissão no Supabase. Rode o supabase_setup.sql (políticas RLS).")}
    }
  }finally{pushing=false}
}

function apSet(em,v){try{const o=JSON.parse(store.get(AP_KEY)||"{}");o[em]=!!v;store.set(AP_KEY,JSON.stringify(o))}catch(e){}}
async function approvedState(uid){
  const r=await rest("wilfit_users?select=approved&user_id=eq."+encodeURIComponent(uid));

async function boot(){
  if(!S.me||!SES||pushing)return;
  const em=S.me;
  try{
    /* 1) aprovação do administrador (checada a cada sincronização) */
    const ap=await approvedState(SES.user.id);
    if(S.me!==em)return;
    apSet(em,ap);
    if(!ap){if(!S.pend){S.pend=true;R()}else paintNet();setSync("ok");return}
    if(S.pend){S.pend=false;await enter(em);R();return}
    if(!AV.carregado)loadAvatar();
    /* 2) sincronização dos dados */
    if(DIRTY[em]){await push();return}
    const row=await pull(SES.user.id);

    if(row&&row.data){
      const nd=fixUser(row.data),a=JSON.stringify(nd);
      LAST=a;
      if(DIRTY[em])return;
      setTimeout(espelhar,600);
      if(a!==JSON.stringify(DB[em])){
        DB[em]=nd;saveLocal();
        const ae=document.activeElement;
        if(!(ae&&/INPUT|SELECT/.test(ae.tagName)))R();
      }
      setSync("ok");
    }else{LAST="";DIRTY[em]=true;saveDirty();await push()}
  }catch(e){
    if(e&&e.auth)forceLogout("Sessão expirada. Entre novamente.");
    else{setSync(navigator.onLine===false&&!(Date.now()-NETD.ok<90000)?"off":"err");if(e&&e.table&&!WARNED){WARNED=true;toast("Tabela não encontrada no Supabase. Rode o supabase_setup.sql.")}}
  }
}

const coachId=()=>{const c=U()&&U().prof.coach;return COACHES[c]?c:"moderada"};
const coachNome=()=>{const p=U()&&U().prof;const a=String((p&&p.apelido)||"").trim();if(a)return a;const n=String((p&&p.nome)||"").trim().split(/\s+/)[0];return n||"atleta"};
function coachFala(sit,seed){
  const L=(CM[coachId()]||CM.moderada)[sit]||[];if(!L.length)return"";
  const i=seed==null?Math.floor(Math.random()*L.length):Math.abs(seed)%L.length;
  return L[i].replace(/\{n\}/g,coachNome());
}
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h};
/* Situação atual do aluno, para o cartão do coach na tela inicial */
function coachSit(){
  const u=U(),hoje=isoLocal(new Date()),p=plan(td());
  const ult=ultimaAtividade();
  if(ult&&ult<hoje){const dias=Math.round((new Date(hoje+"T12:00")-new Date(ult+"T12:00"))/864e5);if(dias>=3&&!(u.hist[hoje]&&u.hist[hoje].s))return"volta"}
  if(!p||!p.ex.length)return"semTreino";
  let t=0,f=0;p.ex.forEach(e=>{t+=e.s;f+=doneN(td(),e)});
  if(!f)return"inicio";if(f>=t)return"completo";if(f/t>=.75)return"quase";return"meio";
}
function ultimaAtividade(){
  const u=U();let m="";
  Object.keys(u.hist).forEach(d=>{if(u.hist[d].s>0&&d>m)m=d});
  u.cardio.forEach(c=>{if(c.date>m)m=c.date});
  return m;
}
let COACH_ALT=0;
function coachCard(){
  const c=COACHES[coachId()],sit=coachSit(),seed=hashStr(isoLocal(new Date())+sit)+COACH_ALT;
  /* ↻ alterna entre frases da situação e frases motivacionais gerais */
  const msg=COACH_ALT%2===1?coachFala("frase",seed):coachFala(sit,seed);

/* ---------- Histórico (para conquistas e sequência) ---------- */
function atualizaHist(d,id,marcou){
  const u=U(),dt=isoLocal(dateOf(+d)),p=plan(+d);
  let t=0,f=0;if(p)p.ex.forEach(e=>{t+=e.s;f+=doneN(+d,e)});
  const h=u.hist[dt]||{};const antesC=!!h.c;
  h.s=f;h.c=t>0&&f>=t?1:0;
  if(marcou&&dt===isoLocal(new Date())&&h.h==null)h.h=new Date().getHours();
  if(f>0||h.h!=null)u.hist[dt]=h;else delete u.hist[dt];
  if(marcou&&id&&u.exu.indexOf(id)<0)u.exu.push(id);
  return !antesC&&!!h.c;
}
/* Primeira vez: reconstrói o histórico recente a partir das séries já marcadas */
function backfillHist(){
  const u=U();if(u.histInit)return;
  const por={};
  Object.keys(u.prog).forEach(k=>{const dt=k.slice(0,10),id=k.slice(11),n=(u.prog[k]||[]).filter(Boolean).length;if(!n)return;(por[dt]=por[dt]||{s:0,ids:[]}).s+=n;por[dt].ids.push(id)});
  Object.keys(por).forEach(dt=>{
    const wd=(new Date(dt+"T12:00").getDay()+6)%7,p=u.plan[wd];let c=0;
    if(p&&p.ex.length)c=p.ex.every(e=>((u.prog[dt+":"+e.id]||[]).slice(0,e.s).filter(Boolean).length)>=e.s)?1:0;
    u.hist[dt]=Object.assign({s:por[dt].s,c},u.hist[dt]||{});
    por[dt].ids.forEach(id=>{if(u.exu.indexOf(id)<0)u.exu.push(id)});
  });
  u.histInit=1;
}

/* ---------- Conquistas ---------- */
function stats(){
  const u=U(),H=u.hist,ds=Object.keys(H);
  const treinos=ds.filter(d=>H[d].c).length,series=ds.reduce((a,d)=>a+(H[d].s||0),0);
  const ativos=new Set(ds.filter(d=>H[d].s>0));u.cardio.forEach(c=>ativos.add(c.date));
  const ord=[...ativos].sort();let best=0,run=0,prev=null;
  ord.forEach(d=>{const t=new Date(d+"T12:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;if(run>best)best=run});
  let atual=0;{const t=new Date();t.setHours(12,0,0,0);if(!ativos.has(isoLocal(t)))t.setDate(t.getDate()-1);while(ativos.has(isoLocal(t))){atual++;t.setDate(t.getDate()-1)}}
  const sem={};ds.filter(d=>H[d].c).forEach(d=>{const t=new Date(d+"T12:00");t.setDate(t.getDate()-((t.getDay()+6)%7));const k=isoLocal(t);sem[k]=(sem[k]||0)+1});
  const semMax=Object.values(sem).reduce((a,b)=>Math.max(a,b),0);
  const km=u.cardio.reduce((a,c)=>a+(+c.km||0),0);
  const diasPlano=[0,1,2,3,4,5,6].filter(i=>u.plan[i]&&u.plan[i].ex.length).length;
  const p=u.prof,perfil=[p.nome,p.alt,p.peso,p.obj].filter(x=>String(x||"").trim()).length+(AV.url?1:0);
  const cedo=ds.some(d=>H[d].h!=null&&H[d].h<7)?1:0,tarde=ds.some(d=>H[d].h!=null&&H[d].h>=21)?1:0;
  return{treinos,series,best,atual,semMax,cardio:u.cardio.length,km,diasPlano,exu:u.exu.length,perfil,cedo,tarde};
}

  const im=d.querySelector(".crs img");im.src=img.src;

  const stage=d.querySelector(".crs"),rng=d.querySelector("input[type=range]");

  const dims=()=>{const rot=st.r%180!==0;return{w:rot?img.naturalHeight:img.naturalWidth,h:rot?img.naturalWidth:img.naturalHeight}};
  const layout=()=>{st.W=stage.clientWidth;const m=dims();st.base=Math.max(st.W/m.w,st.W/m.h);draw()};

    st.x=cx-(cx-st.x)*k;st.y=cy-(cy-st.y)*k;st.z=nz;draw()};
  const centro=()=>{const rc=stage.getBoundingClientRect();return{x:rc.left+rc.width/2,y:rc.top+rc.height/2}};
  layout();

/* Gera a imagem final exatamente como aparece no quadro (512 px, JPEG) */
async function recortar(st){
  const L=512,c=document.createElement("canvas");c.width=c.height=L;const g=c.getContext("2d"),k=L/st.W,s=st.base*st.z*k;
  g.fillStyle="#fff";g.fillRect(0,0,L,L);
  g.translate(L/2+st.x*k,L/2+st.y*k);g.rotate(st.r*Math.PI/180);g.scale(s,s);
  g.drawImage(st.img,-st.img.naturalWidth/2,-st.img.naturalHeight/2);
  return await new Promise((ok,er)=>c.toBlob(b=>b?ok(b):er(new Error("blob")),"image/jpeg",.88));
}

/* -- utilidades geográficas -- */
const RAD=Math.PI/180;
function hav(a,b){const R=6371008.8,dLa=(b[0]-a[0])*RAD,dLo=(b[1]-a[1])*RAD,s=Math.sin(dLa/2)**2+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(s)))}
function polyEnc(pts){let o="",pl=0,pg=0;const e=v=>{v=v<0?~(v<<1):v<<1;let s="";while(v>=0x20){s+=String.fromCharCode((0x20|(v&0x1f))+63);v>>=5}return s+String.fromCharCode(v+63)};
  pts.forEach(p=>{const la=Math.round(p[0]*1e5),lg=Math.round(p[1]*1e5);o+=e(la-pl)+e(lg-pg);pl=la;pg=lg});return o}
function polyDec(str){const pts=[];let i=0,la=0,lg=0;const d=()=>{let r=0,s=0,b;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5}while(b>=0x20);return r&1?~(r>>1):r>>1};
  while(i<(str||"").length){la+=d();lg+=d();pts.push([la/1e5,lg/1e5])}return pts}
/* simplificação Douglas-Peucker em metros (mantém a forma, reduz o tamanho salvo) */
function simplificar(pts,tol){
  if(pts.length<3)return pts.slice();
  const la0=pts[0][0]*RAD,k=Math.cos(la0)*6371008.8*RAD,kk=6371008.8*RAD,P=pts.map(p=>[p[1]*k,p[0]*kk]);
  const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const st=[[0,pts.length-1]];
  while(st.length){const[a,b]=st.pop();let mx=0,ix=-1;const[x1,y1]=P[a],[x2,y2]=P[b],dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy||1e-9;
    for(let i=a+1;i<b;i++){const t=Math.max(0,Math.min(1,((P[i][0]-x1)*dx+(P[i][1]-y1)*dy)/L)),ex=x1+t*dx-P[i][0],ey=y1+t*dy-P[i][1],d=ex*ex+ey*ey;if(d>mx){mx=d;ix=i}}
    if(ix>0&&mx>tol*tol){keep[ix]=1;st.push([a,ix],[ix,b])}}
  return pts.filter((_,i)=>keep[i]);
}
/* filtro de Kalman simples: suaviza o "tremido" do GPS sem atrasar a rota */
function Kalman(q){this.q=q;this.v=-1}
Kalman.prototype.ok=function(la,lg,acc,t){acc=Math.max(1,acc);
  if(this.v<0){this.t=t;this.la=la;this.lg=lg;this.v=acc*acc}
  else{const dt=t-this.t;if(dt>0){this.v+=dt*this.q*this.q/1000;this.t=t}const K=this.v/(this.v+acc*acc);this.la+=K*(la-this.la);this.lg+=K*(lg-this.lg);this.v=(1-K)*this.v}
  return[this.la,this.lg]};

}
function rotaProj(pts,W,H,m){ /* projeta lat/lng para caber na caixa, mantendo proporção */
  const k=Math.cos(pts[0][0]*RAD);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  pts.forEach(p=>{const x=p[1]*k,y=p[0];x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)});
  const sw=Math.max(x1-x0,1e-5),sh=Math.max(y1-y0,1e-5),s=Math.min((W-2*m)/sw,(H-2*m)/sh),ox=(W-sw*s)/2,oy=(H-sh*s)/2;
  return p=>[+(ox+(p[1]*k-x0)*s).toFixed(1),+(oy+(y1-p[0])*s).toFixed(1)];
}

const FONT='"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(g,s,x,y,size,cor,peso,alinh,maxW){
  let sz=size;g.font=(peso||700)+" "+sz+"px "+FONT;
  if(maxW)while(g.measureText(s).width>maxW&&sz>18){sz-=2;g.font=(peso||700)+" "+sz+"px "+FONT}
  g.fillStyle=cor;g.textAlign=alinh||"left";g.textBaseline="alphabetic";g.fillText(s,x,y);return sz;
}
function logo(g,x,y,s){ /* ícone + "WilFit" */
  const k=s/64;rr(g,x,y,64*k,64*k,14*k);g.fillStyle="#121212";g.fill();g.lineWidth=2*k;g.strokeStyle="rgba(255,255,255,.18)";g.stroke();
  g.save();g.translate(x,y);g.scale(k*2,k*2);g.beginPath();g.moveTo(6.5,10);g.lineTo(10.5,22);g.lineTo(16,13);g.lineTo(21.5,22);g.lineTo(25.5,10);
  g.lineWidth=3;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#1DB954";g.stroke();g.restore();
  g.font="800 "+Math.round(46*k)+"px "+FONT;g.textBaseline="middle";g.textAlign="left";g.fillStyle="#fff";g.fillText("Wil",x+80*k,y+33*k);
  const w=g.measureText("Wil").width;g.fillStyle="#1DB954";g.fillText("Fit",x+80*k+w,y+33*k);g.textBaseline="alphabetic";
}
function fundo(g,W,H,sh){
  if(sh.bg==="foto"&&sh.foto){
    const im=sh.foto,s=Math.max(W/im.naturalWidth,H/im.naturalHeight);
    g.drawImage(im,(W-im.naturalWidth*s)/2,(H-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);
    let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"rgba(0,0,0,.55)");gr.addColorStop(.35,"rgba(0,0,0,.05)");gr.addColorStop(.55,"rgba(0,0,0,.25)");gr.addColorStop(1,"rgba(0,0,0,.85)");
    g.fillStyle=gr;g.fillRect(0,0,W,H);return;
  }
  if(sh.bg==="dark"){g.fillStyle="#0f0f10";g.fillRect(0,0,W,H)}
  else{const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,"#0b3d22");gr.addColorStop(.55,"#121212");gr.addColorStop(1,"#0a0a0a");g.fillStyle=gr;g.fillRect(0,0,W,H)}
  const rg=g.createRadialGradient(W*.85,H*.12,10,W*.85,H*.12,W*.75);rg.addColorStop(0,"rgba(29,185,84,.45)");rg.addColorStop(1,"rgba(29,185,84,0)");g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(29,185,84,.12)";g.lineWidth=3;for(let i=0;i<6;i++){g.beginPath();g.arc(W*1.05,H*.95,W*.25+i*70,0,Math.PI*2);g.stroke()}
}
function desenharRota(g,pts,x,y,w,h){
  const pr=rotaProj(pts,w,h,16);g.save();g.translate(x,y);
  g.lineCap="round";g.lineJoin="round";g.shadowColor="rgba(29,185,84,.8)";g.shadowBlur=24;g.strokeStyle="#1DB954";g.lineWidth=12;
  g.beginPath();pts.forEach((p,i)=>{const q=pr(p);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])});g.stroke();g.shadowBlur=0;
  [[pts[0],"#fff"],[pts[pts.length-1],"#F3727F"]].forEach(([p,c])=>{const q=pr(p);g.beginPath();g.arc(q[0],q[1],14,0,Math.PI*2);g.fillStyle=c;g.fill();g.lineWidth=5;g.strokeStyle="#121212";g.stroke()});
  g.restore();
}

/* ---------- Cronômetro de descanso (só roda enquanto há descanso ativo) ---------- */
let REST=null,RT=null;
function startRest(seg){
  REST={end:Date.now()+seg*1000};
  if(!RT)RT=setInterval(paintRest,250);
  paintRest();
}
function stopRest(){REST=null;if(RT){clearInterval(RT);RT=null}paintRest()}
function paintRest(){
  const box=document.getElementById("rest");
  if(REST&&S.me){
    const left=Math.ceil((REST.end-Date.now())/1000);
    if(left<=0){stopRest();if(S.me&&!S.pend)coachBalao(coachFala("descanso"),"⏱️ Descanso concluído");else toast("Descanso concluído ✓");return}
    if(box){
      const html=`<div class="rest"><span>Descanso</span><b>${pad(Math.floor(left/60))}:${pad(left%60)}</b><button class="btn" data-a="pular">Pular</button></div>`;
      if(box.dataset.h!==html){box.dataset.h=html;box.innerHTML=html}
    }
  }else{
    if(RT){clearInterval(RT);RT=null}
    if(box&&box.dataset.h){box.dataset.h="";box.innerHTML=""}
  }
}

/* ---------- Modo administrador ---------- */
async function rpc(name,args){
  const h={apikey:SB_KEY,"Content-Type":"application/json"};
  let tk=null;try{if(SES)tk=await token()}catch(e){}
  if(tk)h.Authorization="Bearer "+tk;else if(SB_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SB_KEY;
  const r=await tfetch(SB_URL+"/rest/v1/rpc/"+name,{method:"POST",headers:h,body:JSON.stringify(args)},15000);
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e={msg:(j&&j.message)||"Erro "+r.status};if(r.status===404||(j&&(j.code==="PGRST202"||j.code==="42883")))e.fn=true;throw e}
  return j||{};
}
async function admLoad(){
  const A=S.adm;if(!A||A.busy)return;
  A.busy=true;R();
  try{
    const j=await rpc("wilfit_admin_list",{pw:A.pw});
    if(!S.adm)return;
    if(j.erro){A.err=j.erro==="bloqueado"?"Muitas tentativas erradas. Aguarde 10 minutos.":"Senha incorreta.";A.step="pw";A.pw=""}
    else{A.users=j.users||[];A.step="list";A.err=""}
  }catch(e){A.err=e&&e.fn?"Função do admin não encontrada. Rode o supabase_setup.sql atualizado.":((e&&e.msg)||"Sem conexão com o Supabase.")}
  A.busy=false;R();
}
async function admSenha(uid){
  const A=S.adm;if(!A||A.busy)return;
  const nova=String(A.nova||"");
  if(nova.length<6){A.err="A nova senha precisa ter pelo menos 6 caracteres.";R();return}
  A.busy=true;R();
  try{
    const j=await rpc("wilfit_admin_senha",{pw:A.pw,uid:uid,nova:nova});
    if(j.erro==="senha")A.err="A nova senha precisa ter pelo menos 6 caracteres.";
    else if(j.erro==="usuario")A.err="Usuário não encontrado.";
    else if(j.erro){A.err="Sessão de admin inválida. Entre de novo.";A.step="pw";A.pw=""}
    else{A.pid=null;A.nova="";A.err="";toast("Nova senha salva ✓ Passe a senha ao usuário.")}
  }catch(e){A.err=e&&e.fn?"Função de senha não encontrada. Rode o wilfit_cadastro.sql.":((e&&e.msg)||"Sem conexão com o Supabase.")}
  A.busy=false;R();
}
async function admSet(uid,ok){
  const A=S.adm;if(!A||A.busy)return;
  A.busy=true;R();
  try{
    const j=await rpc("wilfit_admin_set",{pw:A.pw,uid:uid,ok:ok});
    if(j.erro){A.err="Sessão de admin inválida. Entre de novo.";A.step="pw";A.pw=""}
    else toast(ok?"Usuário aprovado ✓":"Usuário bloqueado");
  }catch(e){A.err=(e&&e.msg)||"Sem conexão com o Supabase."}
  A.busy=false;
  if(A.step==="list")admLoad();else R();
}

/* ---------- Autenticação (Supabase Auth) ---------- */
function amsg(j){
  const m=String(j.msg||j.message||j.error_description||j.error||""),c=j.error_code||"";
  if(c==="invalid_credentials"||/invalid login/i.test(m))return"E-mail ou senha incorretos. Se esqueceu a senha, peça ao administrador para definir uma nova.";
  if(c==="email_not_confirmed"||/not confirmed/i.test(m))return"Conta ainda não liberada no Supabase. Peça ao administrador para rodar o wilfit_cadastro.sql.";
  if(c==="user_already_exists"||/already registered/i.test(m))return"Este e-mail já tem conta. Use Entrar.";
  if(c==="weak_password"||/at least \d+ char/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  if(c==="over_email_send_rate_limit"||/email rate limit/i.test(m))return"Limite de e-mails do Supabase atingido. Rode o supabase_setup.sql atualizado (libera contas sem e-mail) e tente Entrar.";
  if(c==="over_request_rate_limit"||/rate limit/i.test(m)||j.code===429)return"Muitas tentativas. Aguarde um pouco e tente de novo.";
  if(c==="signup_disabled")return"Novos cadastros estão desativados neste projeto.";
  if(c==="email_address_invalid"||/invalid.*email/i.test(m))return"E-mail inválido.";
  return m||"Erro ao autenticar.";
}
async function enter(em){
  const local=DB[em],uid=SES.user.id;
  let data,needPush=false,ap;
  try{ap=await approvedState(uid)}
  catch(e){
    if(e&&e.table)throw{msg:"O banco ainda não está configurado. Rode o supabase_setup.sql atualizado no SQL Editor do Supabase."};
    if(e&&e.auth)throw e;
    ap=apGet(em);
  }
  apSet(em,ap);
  if(!ap){
    DB[em]=fixUser(local);S.me=em;S.pend=true;S.tab="home";S.form.pw="";S.err="";S.ok="";saveLocal();setSync("ok");return;
  }
  S.pend=false;
  try{
    const row=await pull(uid);
    if(row&&row.data&&!(DIRTY[em]&&local)){data=fixUser(row.data);LAST=JSON.stringify(data)}
    else if(local){data=fixUser(local);needPush=true}
    else{data=mkUser();needPush=true}
  }catch(e){
    if(e&&e.table)throw{msg:"As tabelas ainda não existem no Supabase. Rode o arquivo supabase_setup.sql no SQL Editor."};
    if(e&&e.auth)throw e;
    if(local){data=fixUser(local);needPush=true}
    else throw{msg:"Não foi possível carregar seus dados. Verifique a conexão e tente de novo."};
  }
  DB[em]=data;S.me=em;S.tab="home";S.dia=td();S.form.pw="";S.err="";S.ok="";
  backfillHist();checkAch(true);pruneProg();saveLocal();setSync("ok");loadPhotos();loadAvatar();setTimeout(espelhar,800);
  if(needPush){LAST="";DIRTY[em]=true;saveDirty();push()}
}
async function auth(){
  if(S.busy)return;
  const em=S.form.em.trim().toLowerCase(),pw=S.form.pw;
  S.ok="";
  if(!/^\S+@\S+\.\S+$/.test(em)){S.err="Digite um e-mail válido";R();return}
  if(S.aba==="cad"&&pw.length<6){S.err="A senha precisa ter pelo menos 6 caracteres.";R();return}
  if(!pw){S.err="Digite sua senha.";R();return}
  S.busy=true;S.err="";R();
  try{
    const hd={apikey:SB_KEY,"Content-Type":"application/json"};
    let r,j;
    if(S.aba==="cad"){
      /* Cadastro direto no Supabase Auth pela função wilfit_signup: conta já confirmada, sem e-mail,
         pendente de aprovação do administrador */
      let c;
      try{c=await rpc("wilfit_signup",{p_email:em,p_senha:pw})}
      catch(e){S.err=e&&e.fn?"O cadastro ainda não está configurado no Supabase. Rode o arquivo wilfit_cadastro.sql no SQL Editor.":((e&&e.msg)||"Sem conexão. Verifique sua internet.");return}
      if(c.erro){S.err={existe:"Este e-mail já tem conta. Use Entrar. Se não lembra a senha, peça ao administrador para definir uma nova.",senha:"A senha precisa ter pelo menos 6 caracteres.",email:"E-mail inválido.",limite:"Muitos cadastros agora. Tente de novo mais tarde."}[c.erro]||("Não foi possível criar a conta ("+c.erro+").");return}
    }
    r=await tfetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:hd,body:JSON.stringify({email:em,password:pw})});
    j=await r.json().catch(()=>({}));
    if(!r.ok||!j.access_token){
      if(S.aba==="cad"){S.aba="entrar";S.form.pw="";S.ok="Conta criada! Toque em Entrar com o e-mail e a senha que você cadastrou."}
      else S.err=amsg(j);
      return}
    setSes(j);
    await enter(SES.user.email||em);
  }catch(e){
    if(!S.me){SES=null;store.set(SES_KEY,"")}
    S.err=(e&&e.msg)||"Sem conexão. Verifique sua internet.";
  }finally{S.busy=false;R()}
}

    case"gp":S.g=v;break;

function onField(e){
  const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;const k=t.dataset.k;
  if(f==="admpw"){if(S.adm)S.adm.pw=t.value;return}
  if(f==="admnew"){if(S.adm)S.adm.nova=t.value;return}
  if(f==="em")S.form.em=t.value;
  else if(f==="pw")S.form.pw=t.value;
  else if(f==="nome")S.nome=t.value;
  else if(f==="q"){S.q=t.value;const l=$("#lista");if(l)l.innerHTML=listaBib();return}
  else if(f==="pn"){const p=plan(S.dia);if(p){p.n=t.value;save()}return}
  else if(f==="pf"){U().prof[k]=t.value;save();if(e.type==="change"&&checkAch())save();return}
  else if(f==="avatar"){if(e.type==="change"&&t.files&&t.files[0])enviarFoto(t.files[0]);return}
  else if(f==="ex"){
    const p=plan(S.dia),x=p&&p.ex[+t.dataset.i];
    if(x){
      if(k==="r")x[k]=t.value;
      else{const n=Math.floor(+t.value);x[k]=Math.min(k==="s"?20:3600,Math.max(k==="s"?1:0,isNaN(n)?(k==="s"?1:0):n))}
      save();
      if(e.type==="change"&&k!=="r")R();
    }
    return}
  else if(f==="cf"){if(!S.cf)S.cf=novoCF();S.cf[k]=t.value;const pv=document.getElementById("cfprev");if(pv){const x=Object.assign({},S.cf,{min:+String(S.cf.min).replace(",",".")||0,km:+String(S.cf.km).replace(",",".")||0});pv.textContent=cfPrevTxt(x);const kc=document.querySelector('[data-f="cf"][data-k="kcal"]');if(kc&&x.min>0)kc.placeholder="Estimado: "+kcalAuto(x)+" kcal"}if(e.type==="change"&&k==="int"&&!U())return;return}
}

});
